services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=calwriter
      - POSTGRES_USER=calwriter
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, see .env.example}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calwriter"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set, see .env.example}
      - DATABASE_URL=postgresql+psycopg2://calwriter:${POSTGRES_PASSWORD}@db:5432/calwriter
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
volumes:
  db_data:
