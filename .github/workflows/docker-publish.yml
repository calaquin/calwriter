name: Build and Push Docker Image (Any Branch)

on:
  push:
    branches:
      - master
      - pre-release  # Add other branches here as needed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 + arm64 in one multi-platform manifest, so `docker pull` on any
      # machine (x86 server, Raspberry Pi, Apple Silicon, ARM VPS) grabs the
      # right variant automatically under the same tag -- pushing a single-arch
      # image here previously caused "exec format error" on arm64 hosts.
      - name: Determine tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" = "master" ]; then
            TAGS="$TAGS"$'\n'"ghcr.io/${{ github.repository }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
